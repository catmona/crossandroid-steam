image: eclipse-temurin:17-jdk

variables:
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_COMMAND_LINE_TOOLS: "11076708"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"

stages:
  - build
  - preview
  - release

.android_setup: &android_setup
  before_script:
    - apt-get --quiet update --yes
    - apt-get --quiet install --yes wget unzip
    - wget --quiet --output-document=cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_COMMAND_LINE_TOOLS}_latest.zip
    - mkdir -p android-sdk/cmdline-tools
    - unzip -q cmdline-tools.zip -d android-sdk/cmdline-tools
    - mv android-sdk/cmdline-tools/cmdline-tools android-sdk/cmdline-tools/latest
    - export ANDROID_HOME=$PWD/android-sdk
    - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
    - yes | sdkmanager --licenses > /dev/null 2>&1 || true
    - sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}" > /dev/null
    - chmod +x ./gradlew
    # Set up signing if variables are present
    - |
      if [ -n "$KEYSTORE_FILE" ]; then
        echo "$KEYSTORE_FILE" | base64 -d > crossandroid-release.keystore
        cat > keystore.properties << EOF
      storeFile=../crossandroid-release.keystore
      storePassword=$KEYSTORE_PASSWORD
      keyAlias=$KEY_ALIAS
      keyPassword=$KEY_PASSWORD
      EOF
      fi

# Automatic build on every push
build:
  stage: build
  <<: *android_setup
  script:
    - ./gradlew assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: on_success

# Manual preview - builds release APK for private testing
preview:
  stage: preview
  <<: *android_setup
  script:
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - when: manual
      allow_failure: true

# Manual release - only available on tags, creates GitLab Release
release:build:
  stage: preview
  <<: *android_setup
  script:
    - ./gradlew assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/
    expire_in: 1 year
  rules:
    - if: $CI_COMMIT_TAG
      when: manual

release:publish:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: release:build
      artifacts: true
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: "Release build of CrossAndroid"
    assets:
      links:
        - name: "CrossAndroid APK"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/app/build/outputs/apk/release/app-release.apk?job=release:build"
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
