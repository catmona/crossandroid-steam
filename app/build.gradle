plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlin_version"
    id 'com.mikepenz.aboutlibraries.plugin.android' version '15.2.0'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "de.radicalfishgames.crosscode"
    compileSdk = 37

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        // An id of its own so it installs next to upstream CrossAndroid; namespace (R, BuildConfig) stays
        applicationId = "de.radicalfishgames.crosscode.steam"
        minSdk = 26 // JavaSteam uses java.util.Base64
        targetSdk = 36
        versionCode = 15
        versionName = "1.7.1-steam1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    // android.util.Log is a stub on the JVM; let unit tests call it as a no-op.
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Coroutines for lifecycle-aware async operations
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.webkit:webkit:1.17.1'

    // Mod browser: online mod database access
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'io.github.z4kn4fein:semver:3.1.0'

    // Steam connection (playtime, achievements) and the QR code for signing in
    implementation 'in.dragonbra:javasteam:1.6.0'
    // JavaSteam lists protobuf as runtime-only, but our stats handler builds its messages directly
    implementation 'com.google.protobuf:protobuf-java:4.29.2'
    implementation 'com.google.zxing:core:3.5.3'

    // Unit tests (app/src/test): Steam schema parsing, built-in mod routing
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json is a stub on the JVM; this is Android's own org.json source, so tests
    // parse like the device (json.org's library rejects duplicate keys that Android accepts)
    testImplementation 'com.vaadin.external.google:android-json:0.0.20131108.vaadin1'

    // Material Design
    implementation 'com.google.android.material:material:1.14.0'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // About screen with auto-generated license info (Compose UI)
    implementation 'com.mikepenz:aboutlibraries-core:15.2.0'
    implementation 'com.mikepenz:aboutlibraries-compose-m3:15.2.0'
}
