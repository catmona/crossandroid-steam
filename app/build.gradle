plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose' version "$kotlin_version"
    id 'com.mikepenz.aboutlibraries.plugin.android' version '15.2.0'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "de.radicalfishgames.crosscode"
    compileSdk = 37

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId = "de.radicalfishgames.crosscode"
        minSdk = 24
        targetSdk = 36
        versionCode = 12
        versionName = "1.6.1"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // Coroutines for lifecycle-aware async operations
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.webkit:webkit:1.17.1'

    // Mod browser: online mod database access
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'io.github.z4kn4fein:semver:3.1.0'

    // Material Design
    implementation 'com.google.android.material:material:1.14.0'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // About screen with auto-generated license info (Compose UI)
    implementation 'com.mikepenz:aboutlibraries-core:15.2.0'
    implementation 'com.mikepenz:aboutlibraries-compose-m3:15.2.0'
}
