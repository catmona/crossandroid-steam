// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.3.10'
    repositories {
        google()
        mavenCentral()
        maven { url = "https://plugins.gradle.org/m2/" }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // AGP 9.1.0 hardcodes compose-group-mapping:2.2.10, but that version was never published
    // (the artifact was introduced in Kotlin 2.3.0). Force it to use the available version.
    configurations.all {
        resolutionStrategy.eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin' &&
                    details.requested.name == 'compose-group-mapping') {
                details.useVersion kotlin_version
            }
        }
    }
}
